name: Export CurseForge Pack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Refresh and export
        run: |
          packwiz refresh
          mkdir -p exports
          packwiz curseforge export -o exports/SkyblockProgression-curseforge.zip
          ls -lh exports/SkyblockProgression-curseforge.zip
      - uses: actions/upload-artifact@v4
        with:
          name: curseforge-pack
          path: exports/SkyblockProgression-curseforge.zip
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: exports/SkyblockProgression-curseforge.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
